<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Veterinaria del Barrio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>🐾 Veterinaria del Barrio</h1>
    <p>Control de pacientes y visitas</p>
  </header>

  <div id="aviso" class="aviso" role="alert" hidden></div>

  <main>
    <section class="card">
      <h2>1. Registrar paciente</h2>
      <form id="form-paciente" novalidate>
        <label>Nombre <input id="p-nombre" required maxlength="50" autocomplete="off"></label>
        <label>Especie
          <select id="p-especie" required>
            <option value="">Elige…</option>
            <option>Perro</option><option>Gato</option><option>Ave</option>
            <option>Conejo</option><option>Otro</option>
          </select>
        </label>
        <label>Responsable <input id="p-responsable" required maxlength="80" autocomplete="off"></label>
        <button type="submit">Registrar paciente</button>
      </form>
      <p id="msg-paciente" class="msg" role="status"></p>
    </section>

    <section class="card">
      <h2>2. Pacientes registrados</h2>
      <div class="tabla-scroll"><table>
        <thead><tr><th>Nombre</th><th>Especie</th><th>Responsable</th><th>Visitas</th><th></th></tr></thead>
        <tbody id="tabla-pacientes"></tbody>
      </table></div>
      <p id="sin-pacientes" class="vacio">Aún no hay pacientes.</p>
    </section>

    <section class="card">
      <h2>3. Visitas</h2>
      <form id="form-visita" novalidate>
        <label>Paciente <select id="v-paciente" required></select></label>
        <label>Fecha <input type="date" id="v-fecha" required></label>
        <label>Motivo <input id="v-motivo" required maxlength="100" placeholder="Ej: vacuna, control…" autocomplete="off"></label>
        <label>Notas <input id="v-notas" maxlength="300" placeholder="Opcional" autocomplete="off"></label>
        <button type="submit">Registrar visita</button>
      </form>
      <p id="msg-visita" class="msg" role="status"></p>
      <h3 id="titulo-historial">Historial</h3>
      <ul id="historial"></ul>
    </section>
  </main>

  <footer><button id="btn-demo" class="secundario">Cargar datos de ejemplo</button></footer>
  <script src="app.js"></script>
</body>
</html>
